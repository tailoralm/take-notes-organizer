services:
  whisper:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"

    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_BEAM: "5"
      WHISPER_API_KEY: ""
      WHISPER_LOG_LEVEL: INFO
      WHISPER_MAX_UPLOAD_MB: "2048"
      WHISPER_DISABLE_USAGE_COUNTS: "1"

    volumes:
      - whisper-data:/var/lib/whisper

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/v1/models', timeout=5)",
        ]
      start_period: 600s
      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

